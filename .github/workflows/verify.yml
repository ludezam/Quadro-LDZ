name: Verificar e compilar
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/verify-panel.cjs
      - run: node tools/verify-paint.cjs
  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar SDK 34
        shell: pwsh
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compilar e verificar APK de desenvolvimento
        shell: pwsh
        run: ./build-apk.ps1
      - name: Testar versões e redirecionamentos
        shell: pwsh
        run: |
          New-Item -ItemType Directory build/update-tests -Force | Out-Null
          & "$env:JAVA_HOME/bin/javac.exe" -d build/update-tests app/src/main/java/br/com/galeria/painel/ReleaseVersion.java app/src/main/java/br/com/galeria/painel/UpdatePolicy.java tools/ReleaseVersionTest.java tools/UpdatePolicyTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" -cp build/update-tests ReleaseVersionTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" -cp build/update-tests UpdatePolicyTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Quadro-LDZ-desenvolvimento
          path: outputs/Quadro-LDZ-1.1.apk
          if-no-files-found: error

